[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-industrial-rootcause"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "polars>=1.0,<2",
  "pyarrow>=16,<22", "scikit-learn>=1.5,<2", "scipy>=1.12,<2",
  "matplotlib>=3.9,<4", "plotly>=5.24,<7", "shap>=0.46,<1",
  "lime>=0.2.0.1,<1", "pydantic>=2.8,<3", "pyyaml>=6,<7",
  "joblib>=1.4,<2", "tqdm>=4.66,<5", "psutil>=6,<8", "duckdb>=1.1,<2"
]

[project.optional-dependencies]
deep = ["torch>=2.4,<3"]
dashboard = ["streamlit>=1.38,<2"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.poetry]
package-mode = false